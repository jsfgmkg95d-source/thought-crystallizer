name: False negative
description: The Skill rejected material that contained a durable, reusable insight.
title: "[False negative]: "
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a missed crystallization.

        **This Issue is public. Do not paste private, confidential, company, or sensitive conversations.** Describe the behavior without reproducing the source, or provide a synthetic example written from scratch that does not preserve the original wording, structure, entities, numbers, or distinctive details.

  - type: dropdown
    id: host
    attributes:
      label: AI product
      description: Where did you run Thought Crystallizer?
      options:
        - Codex
        - ChatGPT desktop
        - ChatGPT web or mobile
        - Another AI assistant
    validations:
      required: true

  - type: dropdown
    id: invocation
    attributes:
      label: Invocation
      options:
        - Explicit skill invocation
        - Automatic or implicit invocation
        - Instructions supplied as attached files
        - Other or unknown
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Thought Crystallizer version
      description: For example, v0.1.0 or a commit hash.
      placeholder: v0.1.0
    validations:
      required: true

  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Summarize the rejection without including the private source conversation.
      placeholder: The Skill returned DO NOT CRYSTALLIZE with reason..., but the material contained...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What reusable insight was missed?
      description: Explain the candidate type, evidence basis, reuse value, falsifier, and necessary boundaries.
    validations:
      required: true

  - type: textarea
    id: synthetic_example
    attributes:
      label: Optional synthetic reproduction
      description: Write a new example from scratch. Do not anonymize, paraphrase, or structurally preserve private material.
      render: text

  - type: checkboxes
    id: privacy
    attributes:
      label: Public-data confirmation
      options:
        - label: I confirm that this Issue contains no private, confidential, company, or sensitive source material, and any example was written from scratch.
          required: true
