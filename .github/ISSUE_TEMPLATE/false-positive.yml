name: False positive
description: The Skill crystallized material that should have been rejected.
title: "[False positive]: "
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an over-crystallization error.

        **This Issue is public. Do not paste private, confidential, company, or sensitive conversations.** Describe the behavior without reproducing the source, or provide a synthetic example written from scratch that does not preserve the original wording, structure, entities, numbers, or distinctive details.

  - type: dropdown
    id: host
    attributes:
      label: AI product
      description: Where did you run Thought Crystallizer?
      options:
        - Codex
        - ChatGPT desktop
        - ChatGPT web or mobile
        - Another AI assistant
    validations:
      required: true

  - type: dropdown
    id: invocation
    attributes:
      label: Invocation
      options:
        - Explicit skill invocation
        - Automatic or implicit invocation
        - Instructions supplied as attached files
        - Other or unknown
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Thought Crystallizer version
      description: For example, v0.1.0 or a commit hash.
      placeholder: v0.1.0
    validations:
      required: true

  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Summarize the resulting behavior without including the private source conversation.
      placeholder: The Skill returned CRYSTALLIZE because..., but the material was only...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Why should it have been rejected?
      description: Identify the failed gate or the evidence, reuse, privacy, duplication, or instruction-following problem.
    validations:
      required: true

  - type: textarea
    id: synthetic_example
    attributes:
      label: Optional synthetic reproduction
      description: Write a new example from scratch. Do not anonymize, paraphrase, or structurally preserve private material.
      render: text

  - type: checkboxes
    id: privacy
    attributes:
      label: Public-data confirmation
      options:
        - label: I confirm that this Issue contains no private, confidential, company, or sensitive source material, and any example was written from scratch.
          required: true
